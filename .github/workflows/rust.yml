name: Rust CI

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test and lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Test corpus manifest generator
        run: python -m unittest discover -s tools/narf-corpus-bench/scripts -p 'test_*.py' -v

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Normalize Rust formatting
        run: cargo fmt --all

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --workspace

      - name: Test public corpus benchmark runner
        run: cargo test -p narf-corpus-bench --features host-benchmark

      - name: Check library MSRV
        if: runner.os == 'Linux'
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 check --workspace --lib

      - name: Check dependency supply chain
        shell: bash
        run: |
          cargo tree --workspace --all-targets --features narf-corpus-bench/host-benchmark --prefix none > /tmp/cipher1-dependency-tree.txt
          if grep -E '^(arrayref v0[.]3[.]10|internment v0[.]8[.]7|append-only-vec v0[.]1[.]9|proc-macro1 |proc-macro-en |aovine |arone |aronenao |tinymember )' /tmp/cipher1-dependency-tree.txt; then
            echo "A known-compromised Rust crate version is present in the dependency graph." >&2
            exit 1
          fi

      - name: Check cross-platform targets
        if: runner.os == 'Linux'
        run: |
          rustup target add wasm32-unknown-unknown aarch64-linux-android aarch64-apple-ios aarch64-pc-windows-msvc
          for target in wasm32-unknown-unknown aarch64-linux-android aarch64-apple-ios aarch64-pc-windows-msvc; do
            cargo check --workspace --target "$target"
          done

      - name: Run Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run benchmark runner Clippy
        if: runner.os == 'Linux'
        run: cargo clippy -p narf-corpus-bench --features host-benchmark --all-targets -- -D warnings

      - name: Record benchmark environment
        if: runner.os == 'Linux'
        run: |
          mkdir -p target
          {
            echo "# rustc=$(rustc --version)"
            echo "# cargo=$(cargo --version)"
            echo "# runner=$RUNNER_OS/$RUNNER_ARCH"
            echo "# kernel=$(uname -srmo)"
            echo "# cpu=$(awk -F: '/model name/ {gsub(/^[[:space:]]+/, \"\", $2); print $2; exit}' /proc/cpuinfo)"
          } > target/narf-baseline-metadata.txt

      - name: Run NARF baseline benchmark
        if: runner.os == 'Linux'
        run: cargo bench -p nexus-transform --bench narf_baseline | tee target/narf-baseline.csv

      - name: Archive benchmark CSV
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: narf-baseline-${{ github.sha }}
          path: |
            target/narf-baseline.csv
            target/narf-baseline-metadata.txt
          if-no-files-found: error
