name: Rust CI

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test and lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Normalize Rust formatting
        run: cargo fmt --all

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --workspace

      - name: Check WebAssembly target
        if: runner.os == 'Linux'
        run: |
          rustup target add wasm32-unknown-unknown aarch64-linux-android aarch64-apple-ios aarch64-pc-windows-msvc
          for target in wasm32-unknown-unknown aarch64-linux-android aarch64-apple-ios aarch64-pc-windows-msvc; do
            cargo check --workspace --target "$target"
          done

      - name: Run Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run NARF baseline benchmark
        if: runner.os == 'Linux'
        run: cargo bench -p nexus-transform --bench narf_baseline > target/narf-baseline.csv

      - name: Archive benchmark CSV
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: narf-baseline-${{ github.sha }}
          path: target/narf-baseline.csv
          if-no-files-found: error
