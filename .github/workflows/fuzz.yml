name: NEXUS Decoder Fuzzing

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz arbitrary decoder input
        run: cargo fuzz run decode_arbitrary -- -max_total_time=180 -max_len=1048576
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-fuzz-failure-${{ github.run_id }}
          path: |
            fuzz/artifacts/
            fuzz/corpus/
          if-no-files-found: ignore
