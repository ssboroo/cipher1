[package]
name = "narf-corpus-bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Reproducible public-corpus benchmark runner for the experimental NARF transform"

[dependencies]
brotli = "7.0"
lz4_flex = "0.11"
nexus-transform = { path = "../../crates/nexus-transform" }
sha2 = "=0.10.9"
zstd = "0.13"

[features]
default = []
host-benchmark = []

[[bin]]
name = "narf-corpus-bench"
path = "src/main.rs"
required-features = ["host-benchmark"]
