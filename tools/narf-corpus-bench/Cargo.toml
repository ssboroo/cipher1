[package]
name = "narf-corpus-bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Reproducible public-corpus benchmark runner for the experimental NARF transform"

[features]
default = []
host-benchmark = [
    "dep:brotli",
    "dep:lz4_flex",
    "dep:nexus-transform",
    "dep:sha2",
    "dep:zstd",
]

[dependencies]
brotli = { version = "7.0", optional = true }
lz4_flex = { version = "0.11", optional = true }
nexus-transform = { path = "../../crates/nexus-transform", optional = true }
sha2 = { version = "=0.10.9", optional = true }
zstd = { version = "0.13", optional = true }

[[bin]]
name = "narf-corpus-bench"
path = "src/main.rs"
required-features = ["host-benchmark"]
