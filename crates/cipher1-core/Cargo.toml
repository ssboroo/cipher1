[package]
name = "cipher1-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Experimental CIPHER-1 binary framing and integrity prototype"

[dependencies]
blake3 = "=1.8.7"
thiserror = "1.0"
chacha20poly1305 = { version = "=0.10.1", features = ["std"] }
getrandom = { version = "=0.2.15", features = ["js"] }
zeroize = "=1.8.1"

[target.'cfg(any(target_arch = "wasm32", target_os = "android", target_os = "ios", all(target_os = "windows", target_arch = "aarch64")))'.dependencies]
blake3 = { version = "=1.8.7", features = ["pure"] }
